name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Flutter setup
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter precache --ios

      - name: Install certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          WWDR_PATH=$RUNNER_TEMP/AppleWWDRCAG3.cer

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          echo "=== p12 内含证书信息（用于核对是否带私钥） ==="
          openssl pkcs12 -in $CERT_PATH -passin pass:"$P12_PASSWORD" -info -nokeys -clcerts 2>&1 | grep -E 'subject=|issuer=|MAC' || true

          # Apple WWDR 中间证书是签名链必需，新建的 keychain 里没有，必须手动导入
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $WWDR_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $WWDR_PATH -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/security
          security import $CERT_PATH -P "$P12_PASSWORD" -A -f pkcs12 -k $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security default-keychain -s $KEYCHAIN_PATH

          # 把签名 keychain 放到搜索列表最前，同时保留 runner 原有的 keychain（否则系统里的中间证书/根证书不可见）
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | sed -e 's/ *"//g')
          security list-keychains -d user -s $KEYCHAIN_PATH $ORIGINAL_KEYCHAINS

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

          echo "=== 签名 keychain 中的有效签名身份 ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # 找不到任何有效签名身份就直接在这里失败，日志更清晰
          if security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -q "0 valid identities found"; then
            echo "::error::证书导入后仍无有效签名身份，请检查 p12 是否包含 Apple Distribution 证书和对应私钥"
            exit 1
          fi

      - name: Build IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 跨步骤后 keychain 搜索列表可能被重置，构建前重新挂上并解锁签名 keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/ *"//g')
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "=== 本步骤可见的签名身份 ==="
          security find-identity -v -p codesigning

          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=https://api.yxgame.top \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$API_PRIVATE_KEY" > ~/private_keys/AuthKey_$API_KEY.p8
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            --apiKey $API_KEY --apiIssuer $API_ISSUER

      - name: Clean up
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision ~/private_keys
